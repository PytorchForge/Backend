# This workflow will install Python dependencies with uv and build an executable single file
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build Python Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.3"

    - name: Install Python dependencies
      run: uv sync
    - name: Install pipx
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pipx
        python3 -m pipx ensurepath

    - name: Install pyinstaller
      run: pipx install pyinstaller



    - name: Build executable with PyInstaller
      run: |
        pyinstaller modules/main.py \
          --name main \
          --onefile \
          --hidden-import=fastapi \
          --hidden-import=fastapi.middleware.cors \
          --hidden-import=fastapi.middleware.httpsredirect \
          --hidden-import=fastapi.middleware.trustedhost \
          --hidden-import=uvicorn \
          --hidden-import=uvicorn.logging \
          --hidden-import=uvicorn.loops.auto \
          --hidden-import=uvicorn.protocols.http.auto \
          --hidden-import=uvicorn.protocols.websockets.auto \
          --hidden-import=uvicorn.lifespan.on \
          --hidden-import=pydantic \
          --hidden-import=configs.registries.optimizerreg \
          --hidden-import=configs.registries.lossreg \
          --hidden-import=configs.registries.metricreg \
          --hidden-import=configs.registries.layerreg \
          --hidden-import=configs.registries.modelreg \
          --add-data "templates:templates" \
          --add-data "modules:modules" \
          --add-data "pyproject.toml:."

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: main-linux
        path: dist/main

