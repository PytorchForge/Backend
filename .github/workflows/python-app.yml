name: Build Python Binary for server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: write  

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.3"

    - name: Install Python dependencies
      run: uv sync

    - name: Install pipx
      run: |
        python -m pip install --upgrade pip
        python -m pip install pipx
        python -m pipx ensurepath

    - name: Install PyInstaller
      run: pipx install pyinstaller

    - name: Build with PyInstaller
      shell: bash
      run: |
        SEP=":"
        if [[ "${{ runner.os }}" == "Windows" ]]; then SEP=";"; fi

        pyinstaller modules/main.py \
          --name main \
          --onefile \
          --hidden-import=fastapi \
          --hidden-import=fastapi.middleware.cors \
          --hidden-import=fastapi.middleware.httpsredirect \
          --hidden-import=fastapi.middleware.trustedhost \
          --hidden-import=uvicorn \
          --hidden-import=uvicorn.logging \
          --hidden-import=uvicorn.loops.auto \
          --hidden-import=uvicorn.protocols.http.auto \
          --hidden-import=uvicorn.protocols.websockets.auto \
          --hidden-import=uvicorn.lifespan.on \
          --hidden-import=pydantic \
          --hidden-import=configs.registries.optimizerreg \
          --hidden-import=configs.registries.lossreg \
          --hidden-import=configs.registries.metricreg \
          --hidden-import=configs.registries.layerreg \
          --hidden-import=configs.registries.modelreg \
          --add-data "templates${SEP}templates" \
          --add-data "modules${SEP}modules" \
          --add-data "pyproject.toml${SEP}."

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: main-${{ runner.os }}
        path: dist/main*

    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
          files: dist/main*

